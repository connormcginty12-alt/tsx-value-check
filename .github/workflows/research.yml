name: Research data pull

on:
  workflow_dispatch:
    inputs:
      script:
        default: pull_research_data.py

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas lxml requests xlrd
      - run: python research/${{ inputs.script }}
      - name: Save results
        run: |
          git config user.name "tsx-value-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/ data/ || true
          git commit -m "Research data pull" || echo "No changes"
          git pull --rebase
          git push
